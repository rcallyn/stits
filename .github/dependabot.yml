# Weekly dependency updates. Minor/patch bumps are grouped into one PR so
# they don't pile up; CI (lint, typecheck, tests, build) runs on each PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
